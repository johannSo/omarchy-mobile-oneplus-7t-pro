# OnePlus 7T Pro (hotdog): MultiMedia1 -> ADSP -> quaternary MI2S -> two
# TFA9874 amplifiers (earpiece = left channel, bottom speaker = right).
# The amplifiers have no volume control; PipeWire uses software volume.

SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speakers (earpiece and bottom)"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
