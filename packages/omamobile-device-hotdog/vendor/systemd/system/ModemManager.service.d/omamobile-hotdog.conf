# SPDX-License-Identifier: MIT
# OnePlus 7T Pro: the modem reads its EFS through rmtfs and its carrier
# configurations through tqftpserv while it comes up, so ModemManager probes
# it only once both serve (device/hotdog/MODEM-PLAN.md).
[Unit]
Wants=omamobile-rmtfs.service omamobile-tqftpserv.service
After=omamobile-rmtfs.service omamobile-tqftpserv.service
